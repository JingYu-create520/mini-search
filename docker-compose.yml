services:
  mini-search:
    build: .
    image: mini-search:local
    container_name: mini-search
    ports:
      - "9200:9200"
    volumes:
      # Everything the engine learns stays here: the index snapshot and any crawled documents.
      - ./data:/app/data
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    restart: unless-stopped
